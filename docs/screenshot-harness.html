  static get observedAttributes() { return ["icon"]; }
  connectedCallback() { this._render(); }
  attributeChangedCallback() { this._render(); }
  _render() {

    this.style.display = "inline-flex";
    this.style.alignItems = "center";
    this.style.justifyContent = "center";
    this.innerHTML =
      `<svg viewBox="0 0 24 24" style="width:var(--mdc-icon-size,24px);` +
      `height:var(--mdc-icon-size,24px);fill:currentColor;display:block">` +
      `<path d="${d}"/></svg>`;
  }
}

<script>
/* ── Vignette nationale factice ──────────────────────────────────────────
 * Contours réels (DEPT_PATHS / IDF_PATHS, voir france-depts.js) colorés
 * département par département, dans le style de la vraie vignette : liserés
 * blancs entre départements, encre noire pour le libellé et le cadre de
 * l'encart « Paris - Petite couronne ». Le bulletin, lui, reste fictif. */
const HEX = { green: "#2e9e37", yellow: "#f2d600", orange: "#f28c00", red: "#e01f1f" };
const NAMES = { green: "Vert", yellow: "Jaune", orange: "Orange", red: "Rouge" };
const IDS = { green: 1, yellow: 2, orange: 3, red: 4 };

function franceMap(colorOf) {
  // Pas de frontières entre départements, comme sur la vraie vignette : seules
  // les zones de couleur se lisent. Chaque tracé est liseré de sa propre
  // couleur pour sceller les coutures d'anti-aliasing entre voisins.
  const dept = ([code, d], sw) => {
    const fill = HEX[colorOf(code)];
    return `<path d="${d}" fill="${fill}" stroke="${fill}" stroke-width="${sw}" stroke-linejoin="round"/>`;
  };
  const country = Object.entries(DEPT_PATHS).map((e) => dept(e, 1.2)).join("");
  const inset = Object.entries(IDF_PATHS).map((e) => dept(e, 2)).join("");
  const svg =
    `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">` +
    `<g>${country}</g>` +
    `<text x="88" y="34" font-family="Arial" font-size="15" fill="#222222">Paris - Petite couronne</text>` +
    `<rect x="120" y="45" width="72" height="58" fill="none" stroke="#222222" stroke-width="1.5"/>` +
    `<g transform="translate(128,49) scale(0.55)">${inset}</g>` +
    `</svg>`;
  return "data:image/svg+xml;base64," + btoa(unescape(encodeURIComponent(svg)));
}

// La bande est de la vignette de référence, et son cœur Ardèche-Drôme-Gard-Lozère.
const BAND = ["25", "39", "01", "38", "73", "74", "05", "04", "06", "83", "84", "13", "70", "90", "68", "2A", "2B"];
const CORE = ["07", "26", "30", "48"];

const pick = (sets) => (code) =>
  sets.red && sets.red.includes(code) ? "red"
  : sets.orange && sets.orange.includes(code) ? "orange"
  : sets.yellow && sets.yellow.includes(code) ? "yellow"
  : "green";

const MAPS = {
  green: franceMap(() => "green"),
  yellow: franceMap(pick({ yellow: [...BAND, ...CORE] })),
  orange: franceMap(pick({ orange: CORE, yellow: BAND })),
  red: franceMap(
    pick({
      red: ["30", "07", "26", "48", "84"],
      orange: ["34", "11", "13", "83", "12", "43", "42", "69", "01", "38", "04", "05"],
      yellow: ["66", "15", "63", "03", "73", "74", "25", "39", "70", "90", "68", "06", "46", "81", "2A", "2B"],
    })
  ),
};

/* ── États factices ─────────────────────────────────────────────────────── */
const PHEN = {
  1: { slug: "wind", name: "Vent violent", icon: "mdi:weather-windy" },
  2: { slug: "rain", name: "Pluie-inondation", icon: "mdi:weather-pouring" },
  3: { slug: "thunderstorm", name: "Orages", icon: "mdi:weather-lightning" },
  4: { slug: "flood", name: "Crues", icon: "mdi:home-flood" },
  9: { slug: "wave", name: "Vagues-submersion", icon: "mdi:waves-arrow-up" },
};

const DAY = "2026-08-17";
const NEXT = "2026-08-18";
const at = (day, h) => `${day}T${String(h).padStart(2, "0")}:00:00+02:00`;

// Un phénomène du bulletin : [id, couleur, hDébut, hFin, créneaux timeline].
function P(day, id, color, from, to, slots) {
  return {
    phenomenon_id: id,
    phenomenon: PHEN[id].name,
    slug: PHEN[id].slug,
    icon: PHEN[id].icon,
    color,
    color_id: IDS[color],
    color_name: NAMES[color],
    color_hex: HEX[color],
    begin_time: at(day, from),
    end_time: at(day, to),
    timeline: (slots || [[from, to, color]]).map(([b, e, c]) => ({
      begin_time: at(day, b),
      end_time: at(day, e),
      color: c,
    })),
  };
}

const SETS = {
  green: (day) => [
    P(day, 1, "green", 6, 24), P(day, 2, "green", 6, 24), P(day, 3, "green", 6, 24),
    P(day, 4, "green", 6, 24), P(day, 9, "green", 6, 24),
  ],
  yellow: (day) => [
    P(day, 3, "yellow", 14, 20), P(day, 1, "yellow", 10, 18),
    P(day, 2, "green", 6, 24), P(day, 4, "green", 6, 24),
  ],
  orange: (day) => [
    P(day, 3, "orange", 16, 22, [[12, 16, "yellow"], [16, 22, "orange"]]),
    P(day, 2, "yellow", 14, 22),
    P(day, 1, "yellow", 12, 20),
    P(day, 4, "green", 6, 24),
    P(day, 9, "green", 6, 24),
  ],
  red: (day) => [
    P(day, 2, "red", 8, 18, [[4, 8, "orange"], [8, 18, "red"], [18, 24, "orange"]]),
    P(day, 4, "orange", 10, 24),
    P(day, 3, "orange", 6, 16, [[6, 16, "orange"]]),
    P(day, 1, "yellow", 8, 20),
    P(day, 9, "green", 6, 24),
  ],
};

// Un « jeu » = une entrée de configuration : 2 capteurs + 2 caméras.
function dataset(states, entry, dept, deptName, todayLevel, tomorrowLevel) {
  const mk = (period, day, level) => {
    states[`sensor.v_${entry}_${period}`] = {
      state: level,
      attributes: {
        entry_id: entry,
        integration: "meteo_france_vigilance",
        department: dept,
        department_name: deptName,
        period,
        color: level,
        color_id: IDS[level],
        color_name: NAMES[level],
        color_hex: HEX[level],
        expired: false,
        begin_time: at(day, 6),
        end_time: at(day, 24),
        update_time: at(DAY, 6),
        phenomena: SETS[level](day),
        comment:
          "Épisode pluvio-orageux durable sur le sud du pays ; " +
          "cumuls importants attendus, restez prudents.",
        friendly_name: `Vigilance ${deptName} ${period === "today" ? "aujourd'hui" : "demain"}`,
      },
    };
    states[`image.v_${entry}_${period}`] = {
      state: at(DAY, 6),
      attributes: {
        entry_id: entry,
        integration: "meteo_france_vigilance",
        period,
        entity_picture: MAPS[level],
        friendly_name: `Carte ${period === "today" ? "aujourd'hui" : "demain"}`,
      },
    };
  };
  mk("today", DAY, todayLevel);
  mk("tomorrow", NEXT, tomorrowLevel);
  return `sensor.v_${entry}_today`;
}

/* ── Outre-mer ─────────────────────────────────────────────────────────────
 * Un bassin n'a pas de vignette nationale : la carte dessine sa silhouette.
 * Ces jeux servent aussi à vérifier ce que la métropole ne montre jamais —
 * le violet d'un confinement, le gris d'une phase de sauvegarde, et la
 * chronologie d'une alerte cyclonique. */

const OM_NAMES = {
  VIGI971: "Guadeloupe",
  VIGI972: "Martinique",
  VIGI973: "Guyane",
  VIGI974: "La Réunion",
  VIGI976: "Mayotte",
  "VIGI978-977": "Saint-Martin et Saint-Barthélemy",
};

// Les teintes des niveaux que la métropole ne connaît pas.
const OM_HEX = { ...HEX, purple: "#903078", grey: "#999999" };

/* Un phénomène d'outre-mer. Le cyclone porte son propre libellé et son
 * icône ; « Fortes pluies et orages » recouvre ce que la métropole sépare. */
function OP(day, slug, name, icon, level, from, to, slices) {
  return {
    phenomenon_id: slug === "cyclone" ? 10 : slug === "wind" ? 1 : 9,
    slug,
    phenomenon: name,
    icon,
    color: level,
    color_id: IDS[level] || 4,
    color_name: NAMES[level] || name,
    color_hex: OM_HEX[level],
    color_native: level === "purple" || level === "grey" ? level : null,
    begin_time: at(day, from),
    end_time: at(day, to),
    timeline: (slices || [[from, to, level]]).map(([a, b, c]) => ({
      begin_time: at(day, a),
      end_time: at(day, b),
      color_id: IDS[c] || 4,
      color: c === "purple" || c === "grey" ? "red" : c,
      color_hex: OM_HEX[c],
    })),
  };
}

/** Un bassin d'outre-mer : un capteur, aucune vignette, une silhouette. */
function basin(states, entry, domain, level, native, phenomena, phase) {
  const nom = OM_NAMES[domain];
  states[`sensor.v_${entry}_today`] = {
    state: level,
    attributes: {
      entry_id: entry,
      integration: "meteo_france_vigilance",
      // `department` reste la clé que lit la carte ; `domain` dit le bassin.
      department: domain,
      department_name: nom,
      domain,
      basin: domain,
      scale: domain === "VIGI974" || domain === "VIGI976" ? "indian_ocean" : "antilles",
      period: "today",
      color: level,
      color_id: IDS[level] || 4,
      color_name: native
        ? { purple: "Violet", grey: "Gris" }[native]
        : NAMES[level],
      color_hex: OM_HEX[native || level],
      color_native: native || null,
      expired: false,
      begin_time: at(DAY, 6),
      end_time: at(DAY, 24),
      update_time: at(DAY, 6),
      phenomena,
      cyclone_phase: phase || "none",
      comment:
        "Le système dépressionnaire se rapproche du territoire ; " +
        "les conditions se dégradent en cours de journée.",
      friendly_name: `Vigilance ${nom} aujourd'hui`,
    },
  };
  return `sensor.v_${entry}_today`;
}

/* ── Pages ──────────────────────────────────────────────────────────────── */
const q = new URLSearchParams(location.search);
const page = q.get("page") || "hero";
const dark = (q.get("mode") || "light") === "dark";
document.documentElement.classList.toggle("dark", dark);

const states = {};
const hero = dataset(states, "e1", "45", "Loiret", "orange", "red");
const lvGreen = dataset(states, "eg", "45", "Loiret", "green", "green");
const lvYellow = dataset(states, "ey", "63", "Puy-de-Dôme", "yellow", "yellow");
const lvOrange = dataset(states, "eo", "34", "Hérault", "orange", "orange");
const lvRed = dataset(states, "er", "30", "Gard", "red", "red");

// Outre-mer : une alerte cyclonique en cours, un confinement, et le calme.
const omCyclone = basin(states, "om1", "VIGI974", "orange", null, [
  OP(DAY, "cyclone", "Alerte Cyclonique", "mdi:weather-hurricane", "orange", 10, 24,
     [[6, 10, "yellow"], [10, 18, "orange"], [18, 24, "orange"]]),
  OP(DAY, "wave", "Vagues-submersion", "mdi:waves-arrow-up", "orange", 12, 24),
  OP(DAY, "wind", "Vents Forts", "mdi:weather-windy", "yellow", 8, 20),
], "orange");

const omPurple = basin(states, "om2", "VIGI971", "red", "purple", [
  OP(DAY, "cyclone", "Cyclone", "mdi:weather-hurricane", "red", 6, 24,
     [[0, 6, "orange"], [6, 24, "purple"]]),
  OP(DAY, "wind", "Vents violents", "mdi:weather-windy", "red", 8, 22),
  OP(DAY, "wave", "Vagues-submersion", "mdi:waves-arrow-up", "orange", 10, 24),
], "purple");

const omCalm = basin(states, "om3", "VIGI976", "green", null, [
  OP(DAY, "wind", "Vents Forts", "mdi:weather-windy", "green", 6, 24),
  OP(DAY, "wave", "Vagues-submersion", "mdi:waves-arrow-up", "green", 6, 24),
], "none");

// Les trois autres territoires, chacun dans un état différent : la planche
// montre ainsi les six domaines et toute l'échelle des couleurs.
const omMartinique = basin(states, "om4", "VIGI972", "yellow", null, [
  OP(DAY, "rain_thunderstorm", "Fortes pluies et orages", "mdi:weather-lightning-rainy", "yellow", 12, 22),
  OP(DAY, "wind", "Vents violents", "mdi:weather-windy", "green", 6, 24),
], "none");

const omGuyane = basin(states, "om5", "VIGI973", "red", null, [
  OP(DAY, "rain_thunderstorm", "Fortes pluies et orages", "mdi:weather-lightning-rainy", "red", 8, 20,
     [[6, 8, "orange"], [8, 20, "red"], [20, 24, "orange"]]),
  OP(DAY, "wind", "Vents violents", "mdi:weather-windy", "yellow", 10, 18),
], null);

// Le gris : la phase de sauvegarde, après le passage du phénomène.
const omNord = basin(states, "om6", "VIGI978-977", "red", "grey", [
  OP(DAY, "cyclone", "Cyclone", "mdi:weather-hurricane", "red", 6, 24,
     [[0, 12, "purple"], [12, 24, "grey"]]),
  OP(DAY, "wave", "Vagues-submersion", "mdi:waves-arrow-up", "orange", 6, 24),
], "grey");

const hass = {
  locale: { language: "fr" },
  themes: { darkMode: dark },
  states,
  callService() {},
};

const stage = document.getElementById("stage");

function card(config, caption, swatch, width) {
  const cell = document.createElement("div");
  cell.className = "cell";
  if (width) cell.style.width = width + "px";
  if (caption) {
    const cap = document.createElement("div");
    cap.className = "caption";
    cap.innerHTML =
      (swatch ? `<span class="swatch" style="background:${swatch}"></span>` : "") +
      caption;
    cell.appendChild(cap);
  }
  const el = document.createElement("meteo-france-vigilance-card");
  el.setConfig(config);
  el.hass = hass;
  cell.appendChild(el);
  stage.appendChild(cell);
  return el;
}

try {
  if (page === "hero") {
    stage.style.gridTemplateColumns = "500px";
    card({ entity: hero }, null, null, 500);
  } else if (page === "levels") {
    stage.style.gridTemplateColumns = "330px 330px";
    card({ entity: lvGreen, periods: "today" }, "Vert — pas de vigilance particulière", HEX.green, 330);
    card({ entity: lvYellow, periods: "today" }, "Jaune — soyez attentifs", HEX.yellow, 330);
    card({ entity: lvOrange, periods: "today" }, "Orange — soyez très vigilant", HEX.orange, 330);
    card({ entity: lvRed, periods: "today" }, "Rouge — vigilance absolue", HEX.red, 330);
  } else if (page.startsWith("layout-")) {
    const layout = { duo: "duo", focus: "focus", compact: "compact", chrono: "chronologie" }[
      page.slice(7)
    ];
    stage.style.gridTemplateColumns = "430px";
    card({ entity: hero, layout }, null, null, 430);
  } else if (page === "outre-mer") {
    // Ce que la métropole ne montre jamais : une silhouette dessinée, le
    // violet d'un confinement, et une alerte cyclonique en cours. Trois
    // territoires côte à côte, de la même hauteur : la page se photographie
    // d'un bloc, sans rien couper.
    stage.style.gridTemplateColumns = "300px 300px 300px";
    stage.style.alignItems = "start";
    card({ entity: omCyclone, periods: "today" }, "La Réunion — alerte cyclonique orange", HEX.orange, 300);
    card({ entity: omPurple, periods: "today" }, "Guadeloupe — violet, confinez-vous", "#903078", 300);
    card({ entity: omGuyane, periods: "today" }, "Guyane — rouge, pas de cyclone ici", HEX.red, 300);
    card({ entity: omMartinique, periods: "today" }, "Martinique — jaune", HEX.yellow, 300);
    card({ entity: omNord, periods: "today" }, "St-Martin / St-Barth — gris, phase de sauvegarde", "#999999", 300);
    card({ entity: omCalm, periods: "today" }, "Mayotte — rien à signaler", HEX.green, 300);
  } else if (page === "outre-mer-compact") {
    // La disposition compacte n'affiche aucune carte : c'est son objet, tenir
    // sur une ligne pour empiler plusieurs territoires.
    stage.style.gridTemplateColumns = "430px";
    for (const e of [omCyclone, omPurple, omGuyane, omMartinique, omNord, omCalm]) {
      card({ entity: e, periods: "today", layout: "compact" }, null, null, 430);
    }
  } else if (page === "outre-mer-chrono") {
    stage.style.gridTemplateColumns = "430px";
    card({ entity: omCyclone, periods: "today", layout: "chronologie" }, null, null, 430);
  } else if (page === "themes") {
    stage.style.gridTemplateColumns = "350px 350px";
    stage.style.alignItems = "start";
    card({ entity: hero, theme: "officiel", show_map: false, periods: "today" }, "theme: officiel", null, 350);
    card({ entity: hero, theme: "bandeau", show_map: false, periods: "today" }, "theme: bandeau", null, 350);
    card({ entity: hero, theme: "plein", show_map: false, periods: "today" }, "theme: plein", null, 350);
    card({ entity: hero, theme: "sobre", show_map: false, periods: "today" }, "theme: sobre", null, 350);
  }
} catch (err) {
  document.getElementById("fatal").textContent = String(err.stack || err);
}
window.addEventListener("error", (e) => {
  document.getElementById("fatal").textContent += "\n" + e.message;
});
</script>
